name: Bug 报告
description: 报告可以安全复现的项目问题；不要提交凭据或客户数据。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 如问题涉及未公开漏洞，请退出此表单并使用仓库 Security 页面的私密漏洞报告入口。
  - type: input
    id: version
    attributes:
      label: 项目版本
      description: 填写 Release 标签或提交 SHA。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 填写相关系统、PHP/Python、数据库和浏览器版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏数据给出最小复现过程。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已移除凭据、客户数据、生产地址和未脱敏日志。
          required: true
        - label: 此问题不包含尚未修复的可利用漏洞细节。
          required: true
